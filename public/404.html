<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07152b">
    <meta name="robots" content="noindex">
    <title>Página não encontrada — BackupHub</title>
    <link rel="icon" href="/backuphub/assets/backuphub.ico" sizes="any">
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        color: #fff;
        background:
          radial-gradient(circle at 20% 15%, #113c74, transparent 35%),
          linear-gradient(145deg, #07152b, #030b18);
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      }
      main {
        width: min(100%, 620px);
        padding: clamp(28px, 8vw, 58px);
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 26px;
        background: rgb(255 255 255 / 5%);
        box-shadow: 0 28px 70px rgb(0 0 0 / 28%);
        text-align: center;
      }
      img {
        width: 84px;
        height: 84px;
        margin: 0 auto 24px;
        border-radius: 18px;
      }
      p:first-of-type {
        margin: 0 0 12px;
        color: #79baff;
        font-weight: 800;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 14px;
        font-size: clamp(2rem, 9vw, 3.8rem);
        line-height: 1.05;
        letter-spacing: -.05em;
      }
      p {
        margin: 0 auto 26px;
        color: #b7c7dc;
        line-height: 1.65;
      }
      a {
        display: inline-flex;
        min-height: 52px;
        padding: 13px 20px;
        align-items: center;
        border-radius: 12px;
        color: #fff;
        background: linear-gradient(135deg, #075fd6, #2a8cff);
        font-weight: 750;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #6fb2ff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/backuphub/assets/icon-180.png" width="84" height="84" alt="">
      <p>Erro 404</p>
      <h1>Essa página não foi encontrada.</h1>
      <p>
        O endereço pode ter mudado ou ainda não estar disponível. Volte para a
        página inicial do BackupHub.
      </p>
      <a href="/backuphub/">Voltar ao início</a>
    </main>
  </body>
</html>
